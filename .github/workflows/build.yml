name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" ditekan manual di tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Make build script executable
      run: chmod +x launcher/build.sh # Sesuaikan jika lokasi skrip build berbeda

    - name: Run Build Script to Create APK
      run: |
        cd launcher
        ./build.sh

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: glass-tv-home-indo-apk
        path: |
          launcher/**/*.apk
          **/*.apk
